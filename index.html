<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gostinho de Casa — Marmitas artesanais</title>
  <link rel="icon" href="/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" />
  <link rel="stylesheet" href="/style.css?v=4" />
</head>
<body>
  <header class="site" id="site-header"></header>
  <main class="wrap">
    <div class="banners no-scrollbar" id="promos"></div>

    <h2 class="sec-title">Categorias</h2>
    <div class="cat-circles no-scrollbar" id="cats"></div>

    <a class="store-card" href="/cardapio.html" id="store-card"></a>

    <h2 class="sec-title">Mais pedidos</h2>
    <div class="dish-list" id="featured"></div>

    <h2 class="sec-title">Avaliações</h2>
    <div class="reviews no-scrollbar" id="reviews"></div>

    <section class="info-box">
      <div>
        <h2 class="sec-title" style="margin-top:0">Entrega e retirada</h2>
        <p class="muted" id="addr"></p>
        <p class="muted" id="hours"></p>
        <p class="note" id="advance"></p>
      </div>
      <div>
        <p><b>Taxas por bairro</b></p>
        <ul id="zones" style="list-style:none;padding:0;margin:0"></ul>
      </div>
    </section>
  </main>
  <footer class="site" id="site-footer"></footer>
  <a class="cartbar" id="cartbar" href="/carrinho.html"></a>
  <script src="/js/catalog-data.js?v=4"></script>
  <script src="/js/shared.js?v=4"></script>
  <script src="/js/home.js?v=4"></script>
</body>
</html>
