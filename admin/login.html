<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Login · Painel Gostinho de Casa</title>
  <link rel="icon" href="/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" />
  <link rel="stylesheet" href="admin.css" />
</head>
<body class="login-page">
  <div class="login">
    <div class="login__visual">
      <div class="login__overlay"></div>
      <div class="login__visual-content">
        <img src="/logo.png" alt="" />
        <h1>Gostinho de Casa</h1>
        <p>Painel para gerenciar cardápio, pedidos e encomendas.</p>
      </div>
    </div>
    <div class="login__form-wrap">
      <form class="login__box" id="login">
        <h2>Entrar no painel</h2>
        <p style="color:var(--muted);font-size:.9rem;margin-bottom:1.25rem">Acesso administrativo</p>
        <div class="form-group">
          <label>E-mail</label>
          <input type="email" name="email" value="admin@gostinhodecasa.com" required autocomplete="username" />
        </div>
        <div class="form-group">
          <label>Senha</label>
          <input type="password" name="password" value="admin123" required autocomplete="current-password" />
        </div>
        <p class="login__error" id="err"></p>
        <button class="btn btn-primary" style="width:100%;justify-content:center" type="submit">Entrar</button>
        <p class="login__hint">Padrão: admin@gostinhodecasa.com / admin123 — troque nas configurações.</p>
        <p style="text-align:center;margin-top:1rem"><a href="/" style="color:var(--leaf);font-size:.85rem">← Voltar ao site</a></p>
      </form>
    </div>
  </div>
  <script>
    document.getElementById("login").addEventListener("submit", async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      const email = fd.get("email");
      const password = fd.get("password");
      const btn = e.target.querySelector("button");
      btn.disabled = true;
      btn.textContent = "Entrando...";
      try {
        const res = await fetch("/api/data.php", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ action: "login", email, password }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Falha no login");
        sessionStorage.setItem("gostinho_admin_pass", password);
        sessionStorage.setItem("gostinho_admin_email", email);
        sessionStorage.setItem("admin_logged", "true");
        location.href = "index.html";
      } catch (err) {
        document.getElementById("err").textContent = err.message;
        btn.disabled = false;
        btn.textContent = "Entrar";
      }
    });
  </script>
</body>
</html>
