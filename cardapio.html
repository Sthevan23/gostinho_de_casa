<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="refresh" content="0;url=/#cardapio" />
  <title>Cardápio · Gostinho de Casa</title>
  <script>
    (function () {
      var p = new URLSearchParams(location.search);
      var qs = new URLSearchParams();
      if (p.get("categoria")) qs.set("categoria", p.get("categoria"));
      if (p.get("q")) qs.set("q", p.get("q"));
      var s = qs.toString();
      location.replace(s ? "/?" + s + "#cardapio" : "/#cardapio");
    })();
  </script>
</head>
<body></body>
</html>
